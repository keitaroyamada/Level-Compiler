<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="script-src 'self'" />
    <title>LC Plotter</title>
    <link rel="stylesheet" href="plotter_styles.css" />
    <script src="js/renderer_plotter.js" defer></script>

    <script src="js/msgpack.min.js"></script>
    <script src="js/p5.min.js"></script>
    <script src="js/p5.svg.js" defer></script>
  </head>
  <body>
    <div id="container">

      <div id="menu">

        <div id="set_load">
          
          <div id="load_list">
            <p title="Select a loaded CSV or drag and drop a new file here to start.">1. Select or Drop New Source CSV file</p>
            <select id="c_collection" title="Drag and drop your CSV file first, then select it from this list to proceed."></select>
          </div>
          <div class="bt_holder">
            <button class="bt" id="bt_add" title="Click to create a new plot configuration for the selected CSV.">2. Add to Plot List</button>
          </div>
        </div>

                
        <div id="plot_list_base">
          <hr>
          <p id="plot_list_name" title="Manage your plot series here. Use the Add button above to get started.">3. Plot List (Configure Series)</p>
          <div id="plot_list"></div>
        </div>

        <div id="plot_options">
          <hr>
          <p id="plot_option_name">Plot Options</p>
          <select id="depth_scale">
            <option value="drilling_depth">Drilling depth</option>
            <option value="composite_depth" selected>Composite depth</option> 
            <option value="event_free_depth">Event Free Depth</option>
            <option value="age">Age</option>
          </select>
        </div>

      </div>

      <div id="plot_area">   
        <div id="scroller">
          <div id="canvasBase"></div>
        </div>
        <div id="p5Canvas"></div> 
      </div>

    </div>
  </body>

</html>
