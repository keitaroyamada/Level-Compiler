<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="script-src 'self'" />
    <title>LC Converter</title>
    <link rel="stylesheet" href="converter_styles.css" />

    <script src="js/msgpack.min.js"></script>
    <script src="js/renderer_converter.js" defer></script>
  </head>
  <body>
    <div id="container">
      <div class="import_row">
        <div>
          <button class="bt" id="cvt_bt_import" title="Import target data">Select csv</button>
        </div>
        <div>
          <p id="data_path">...</p>
        </div>
        <div class="export_row">
          <button class="bt" id="cvt_bt_convert" title="convert">Convert</button>
        </div>
      </div>
        <div class="id_check_row">
          <div class="check_outside">
            <input type="checkbox" id="allow_outside_data">
            <label for="allow_outside_data">Allow data outside sections</label>
          </div>

          <div class="precision_output">
            <label for="precision">Output precision:</label>
            <input type="number" id="precision" min="0" max="10" step="1" value="1">
          </div>
        </div>        
      <div>
        <p id="num_rows">...</p>
      </div>

      <div class="data_id">
        <div class="correlation_id">
          <p>Mounted Correlation Model</p>
          <select id="cvt_correlation_model"></select>
        </div>
        <div class="age_id">
          <p>Mounted Age Model</p>
          <select id="cvt_age_model"></select>
        </div>
      </div>

      <div class="depth">
        <div>
          <p>Select source columns</p>
          <select id="cvt_source_type">
            <option value="trinity" selected>Trinity</option>
            <option value="composite_depth">Composite depth</option>
            <option value="event_free_depth">Event free depth</option>
            <option value="age">Age</option>
          </select>          
        </div>
        <div id="depth_definition"></div>
      </div>
      <div id="cvt_source_chooser"></div>
      <div id="cvt_data__table">
        <table id="data_table"></table>
      </div>
      
    </div>
  </body>
</html>
