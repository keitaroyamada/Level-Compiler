<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="script-src 'self'" />
    <title>Level Compiler</title>
    <link rel="stylesheet" href="index_styles.css" />

    <script src="js/msgpack.min.js"></script>
    <script src="js/p5.min.js"></script>
    <script src="js/p5.svg.js" defer></script>
    <script src="js/renderer.js" defer></script>
  </head>
  <body>
    <div class="container">
      <div class="base">
        <div id="horizontal_target"></div>
        <div id="toolbar">
          <button id="bt_reload" title="Reload csv model">
            <img src="" alt="Reload" />
          </button>

          <button id="bt_grid" title="Grid(Ctrl/⌘ + G)">
            <img src="" alt="Grid" />
          </button>
          <button id="bt_finder" title="Finder(Ctrl/⌘ + F)">
            <img src="" alt="Finder" />
          </button>
          <button id="bt_target" title="Pointer">
            <img src="" alt="Target" />
          </button>

          <button id="bt_zoomin" title="Zoom in (Ctrl + Scroll: Vertical, Ctrl + Alt/⌥ + Scroll: Horizontal, Alt/⌘ + Scroll: Hole distance)">
            <img src="" alt="Zoom in" />
          </button>
          <button id="bt_zoom0" title="Reset zoom">
            <img src="" alt="Reset Zoom" />
          </button>
          <button id="bt_zoomout" title="Zoom out (Ctrl + Scroll: Vertical, Ctrl + Alt/⌥ + Scroll: Horizontal, Alt/⌘ + Scroll: Hole distance)">
            <img src="" alt="Zoom out" />
          </button>          
          <button id="bt_zoomactual" title="">
            <img src="" alt="Zoom Actual" />
          </button>

          <button id="bt_core_model" title="Model(Show/Hide)">
            <img src="" alt="Model" />
          </button>
          <button id="bt_event_layer" title="Marker layer(Collapse/Expand)">
            <img src="" alt="Event" />
          </button>
          <button id="bt_connection" title="Connection(Show/Hide)">
            <img src="" alt="Connection" />
          </button>
          <button id="bt_show_labels" title="Labels(Ctrl/⌘: Name, Shift/⇧: Position)">
            <img src="" alt="Show marker Labels" />
          </button>
          <button id="bt_source" title="depth source">
            <img src="" alt="Source" />
          </button>
          <button id="bt_rank" title="Interpolation reliability">
            <img src="" alt="Rank" />
          </button>
          

          <button id="bt_chart" title="Data plot(Show/Hide)">
            <img src="" alt="Chart" />
          </button>
          <button id="bt_core_photo" title="Section images(Show/Hide)">
            <img src="" alt="Photo" />
          </button>
          
          

          <button id="bt_divider" title="divider">
            <img src="" alt="Divider" />
          </button>
          <button id="bt_measure" title="measure">
            <img src="" alt="Measure" />
          </button>
          <button id="bt_snapshot" title="snapshot">
            <img src="" alt="Snapshot" />
          </button>
          <button id="bt_pen" title="Pen(Show/Hide, Ctrl/⌘ + N: Reset)">
            <img src="" alt="Pen" />
          </button>
          
        </div>
        <div id="overlay"></div>
        <div id="scroller">
          <!--size is displayed size-->
          <div id="canvasBase"></div>
        </div>
        <div id="p5Canvas"></div>
        <div id="p5penCanvas"></div>
        <div id="p5measureCanvas"></div>
        <canvas id="rasterCanvas"></canvas>        
      </div>
      <div class="rightsidemenu">
        <div class="hole_menu">
          <div id="hole_list"></div>
        </div>
      </div>
    </div>    
  </body>
  <footer>
    <div class="footerLeft">
      <select id="YAxisSelect">
        <option value="drilling_depth">Drilling depth</option>
        <option value="composite_depth" selected>Composite depth</option>
        <option value="event_free_depth">Event free depth</option>
        <option value="age">Age</option>
      </select>
      <select id="ImageSetSelect" title="ImageSet used for display and image drop target">
        <option value="source_1" selected>ImageSet 1</option>
        <option value="source_2">ImageSet 2</option>
        <option value="source_3">ImageSet 3</option>
      </select>
      <select id="AgeModelSelect"></select>
      <span id="footerLeftText"></span>
    </div>
    <!--<button id="testButton">test</button>-->
    <div class="footerRight">
      <span id="footerRightText">---</span>
    </div>
  </footer>
</html>
